name: Publicar site HTML no GitHub Pages

on:
  push:
    branches: ["main"]

  # Permite executar o deploy manualmente a partir da aba Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Enviar ficheiros
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Se os teus ficheiros (index.html) estiverem na raiz do repositório
          
      - name: Executar Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        
